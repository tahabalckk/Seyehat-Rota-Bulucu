<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Seyahat Rota Uygulaması</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; padding: 40px; }
        .konteyner { background: white; padding: 30px; border-radius: 10px; border: 1px solid #ccc; max-width: 800px; margin: auto; }
        .sonuc-alani { display: none; margin-top: 20px; padding: 20px; border: 2px solid #007bff; border-radius: 8px; }
        .sehir-kart { padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .sure-bilgi { font-style: italic; color: #555; font-size: 14px; }
        h2 { color: #333; }
        .btn-hesapla { width: 100%; padding: 12px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="konteyner shadow-sm">
    <h2 class="text-center">Nereye Gitmeli? (Rota Bulucu)</h2>
    <hr>
    
    <div class="row g-3">
        <div class="col-md-6">
            <label>Bütçeniz (TL):</label>
            <input type="number" id="butceInput" class="form-control" placeholder="Örn: 3000">
        </div>
        <div class="col-md-6">
            <label>Nereye:</label>
            <select id="alan" class="form-select">
                <option value="ic">Yurt İçi</option>
                <option value="dis">Yurt Dışı</option>
            </select>
        </div>
        <div class="col-md-6">
            <label>Tatil Tipi:</label>
            <select id="tip" class="form-select">
                <option value="deniz">Deniz</option>
                <option value="kultur">Kültür</option>
                <option value="doga">Doğa</option>
            </select>
        </div>
        <div class="col-md-6">
            <label>Ulaşım:</label>
            <select id="arac" class="form-select">
                <option value="oto">Araba / Otobüs</option>
                <option value="ucak">Uçak</option>
            </select>
        </div>
    </div>

    <button onclick="hesapla()" class="btn btn-primary btn-hesapla">TATİL YERİNİ SEÇ</button>

    <div id="sonucDiv" class="sonuc-alani">
        <h4 id="baslik">Sizin İçin Öneriler:</h4>
        <div id="liste"></div>
    </div>
</div>

<script>
function hesapla() {
    var butce = document.getElementById("butceInput").value;
    var yer = document.getElementById("alan").value;
    var mod = document.getElementById("tip").value;
    var ulasim = document.getElementById("arac").value;
    var liste = document.getElementById("liste");
    var sonucKutu = document.getElementById("sonucDiv");

    if (butce == "" || butce <= 2000) {
        alert("Lütfen 2000 TL'den büyük bir bütçe girin!");
        return;
    }

    var icerik = "";

    // 2000 - 4000 ARASI
    if (butce > 2000 && butce <= 4000) {
        var sure = (ulasim == "oto") ? "1 Saat" : "Uçuş Yok";
        icerik += "<div class='sehir-kart'><b>📍 Adana / Karataş</b><br><span class='sure-bilgi'>Yol Süresi: " + sure + "</span></div>";
        
        var sure2 = (ulasim == "oto") ? "2 Saat" : "Uçuş Yok";
        icerik += "<div class='sehir-kart'><b>📍 Mersin / Erdemli</b><br><span class='sure-bilgi'>Yol Süresi: " + sure2 + "</span></div>";
    }

    // 4000 - 8000 ARASI
    else if (butce > 4000 && butce <= 8000) {
        if (mod == "deniz") {
            var s1 = (ulasim == "oto") ? "13 Saat" : "1.5 Saat";
            var s2 = (ulasim == "oto") ? "11 Saat" : "1.5 Saat";
            icerik += "<div class='sehir-kart'><b>📍 Balıkesir / Akçay</b><br><span class='sure-bilgi'>Süre: " + s1 + "</span></div>";
            icerik += "<div class='sehir-kart'><b>📍 Sinop / Hamsilos</b><br><span class='sure-bilgi'>Süre: " + s2 + "</span></div>";
        } else if (mod == "kultur") {
            var s1 = (ulasim == "oto") ? "7 Saat" : "1 Saat";
            icerik += "<div class='sehir-kart'><b>📍 Amasya</b><br><span class='sure-bilgi'>Süre: " + s1 + "</span></div>";
            icerik += "<div class='sehir-kart'><b>📍 Konya</b><br><span class='sure-bilgi'>Süre: 4 Saat</span></div>";
        } else {
            icerik += "<div class='sehir-kart'><b>📍 Isparta / Eğirdir</b><br><span>Doğa gezisi için birebir.</span></div>";
            icerik += "<div class='sehir-kart'><b>📍 Bolu / Göynük</b><br><span>Sakin bir tatil yeri.</span></div>";
        }
    }

    // 8000 ÜSTÜ
    else {
        if (yer == "ic") {
            if (mod == "deniz") {
                var v1 = (ulasim == "ucak") ? "1.5 Saat" : "12 Saat";
                icerik += "<div class='sehir-kart'><b>📍 Muğla / Datça</b><br><span>Süre: " + v1 + "</span></div>";
                icerik += "<div class='sehir-kart'><b>📍 Antalya / Kaş</b><br><span>Süre: 1.5 Saat</span></div>";
            } else {
                icerik += "<div class='sehir-kart'><b>📍 Mardin / Eski Şehir</b></div>";
                icerik += "<div class='sehir-kart'><b>📍 Rize / Ayder Yaylası</b></div>";
            }
        } else {
            icerik += "<div class='sehir-kart'><b>📍 Karadağ / Budva</b><br><span>(Vizesiz Gidilebilir)</span></div>";
            icerik += "<div class='sehir-kart'><b>📍 Yunanistan / Thassos</b></div>";
        }
    }

    liste.innerHTML = icerik;
    sonucKutu.style.display = "block";
}
</script>

</body>
</html>
